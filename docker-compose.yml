# Local / small VPS: app + MySQL
services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: psha_portal
      MYSQL_USER: psha_user
      MYSQL_PASSWORD: psha_pass
    ports:
      - "3306:3306"
    volumes:
      - psha_mysql:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  app:
    build: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
      SESSION_SECRET: change_me_to_a_long_random_string_at_least_32_chars
      DATABASE_HOST: db
      DATABASE_PORT: 3306
      DATABASE_NAME: psha_portal
      DATABASE_USER: psha_user
      DATABASE_PASSWORD: psha_pass
      COOKIE_SECURE: "false"
      COOKIE_SAME_SITE: lax
      RUN_MIGRATIONS_ON_BOOT: "true"
      AUTO_SEED: "true"
    depends_on:
      - db
    volumes:
      - psha_uploads:/app/public/uploads

volumes:
  psha_mysql:
  psha_uploads:
